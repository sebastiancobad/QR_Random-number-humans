<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B3D6B">
<title>Junta de inversión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;600&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="junta.css">
</head>
<body>
<main class="cel">
  <header class="cel-cabeza">
    <div class="marca">
      <span class="t">Junta de inversión</span>
      <span class="g" id="miGrupo"></span>
    </div>
    <div class="avance" id="avance" aria-label="Avance de la actividad"></div>
  </header>

  <section id="vUnirse" hidden>
    <h1>Columna de mosto</h1>
    <p>El primer puesto gana la nota.</p>
    <div class="campo">
      <label for="nombre">Nombre y apellido</label>
      <input type="text" id="nombre" maxlength="40" autocomplete="name" placeholder="Por ejemplo, Laura Gómez">
    </div>
    <button class="boton" id="entrar" type="button">Entrar a la junta</button>
  </section>

  <section id="vEspera" class="aviso" hidden>
    <span class="ico" data-ico="clock"></span>
    <h2 id="esperaTit">La junta empieza en un momento</h2>
    <p id="esperaTxt">La pantalla cambia sola cuando abra la ronda.</p>
  </section>

  <section id="vRonda" hidden>
    <div class="etq" id="rEtq"></div>
    <h1 id="rTit"></h1>
    <div id="rCtx"></div>
    <div class="formula" id="rFor" hidden></div>
    <p class="pregunta" id="rPre"></p>
    <div id="rCampo"></div>
    <div class="campo" id="rJus" hidden>
      <label for="jus">Justificación</label>
      <textarea id="jus" maxlength="400" placeholder="Escriba la razón técnica de la elección"></textarea>
      <div class="contador" id="jusCont"><div class="barra"><i></i></div><span id="jusFalta">Faltan 20 caracteres</span><span class="n" id="jusN">0</span></div>
    </div>
    <button class="boton apagado" id="enviar" type="button">Enviar respuesta</button>
    <p class="expl" id="enviada" hidden></p>
  </section>

  <section id="vRevelada" hidden>
    <div class="etq" id="vEtq"></div>
    <h1 id="vTit"></h1>
    <div class="res">
      <div class="fila"><span>Su respuesta</span><span class="num" id="vSuya"></span></div>
      <div class="fila"><span id="vBuenaEt">Respuesta correcta</span><span class="num" id="vBuena"></span></div>
      <div class="fila"><span>Puntos de la ronda</span><span class="grande" id="vPts"></span></div>
      <div class="fila"><span>Acumulado y puesto</span><span class="num" id="vTot"></span></div>
    </div>
    <p class="expl" id="vExp"></p>
  </section>

  <section id="vFinal" class="aviso" hidden>
    <span class="ico" data-ico="trophy"></span>
    <h2 id="fTit"></h2>
    <p id="fTxt"></p>
  </section>

  <div id="alerta" class="alerta" role="alert" hidden></div>
</main>

<script type="module">
import { ICONOS } from "./iconos.js";
import { RONDAS, N_RONDAS, fmt, puntaje, tabla, rondaContable, datosHTML, cadenaHTML } from "./rondas.js";

const $ = id => document.getElementById(id);
const pintarIconos = (raiz = document) => raiz.querySelectorAll("[data-ico]").forEach(el => { el.innerHTML = ICONOS[el.dataset.ico] || ""; });
function alerta(msg) { $("alerta").hidden = !msg; $("alerta").textContent = msg || ""; }

let datos;
try { datos = await import("./datos.js"); }
catch (e) { console.error(e); alerta("No se pudo conectar con la base de datos. Revise la conexión y recargue la página."); throw e; }
const { escuchar, registrar, responder, sesion, nuevoId } = datos;

const LLAVE = "junta:" + sesion;
let yo = null;
try { yo = JSON.parse(localStorage.getItem(LLAVE)); } catch { yo = null; }
let estado = null;
let seleccion = null;        // valor elegido en la ronda abierta
let orden = [];              // ronda de ordenar
let rondaPintada = -1;
let pendiente = false;
const norm = t => t.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/\s+/g, " ").trim();

// --------------------------------------------------------------- unirse
$("entrar").addEventListener("click", async () => {
  const nombre = $("nombre").value.trim().replace(/\s+/g, " ");
  if (nombre.length < 2) { alerta("Escriba su nombre y apellido."); return; }
  if (estado && Object.values(estado.g || {}).some(g => g.nombre && norm(g.nombre) === norm(nombre))) { alerta("Ese nombre ya está registrado. Escriba su nombre completo."); return; }
  const gid = "g" + nuevoId();
  try {
    await registrar(gid, nombre);
    yo = { gid, nombre, rev: estado ? estado.rev : 0 };
    localStorage.setItem(LLAVE, JSON.stringify(yo));
    alerta(""); pintar();
  } catch (e) { console.error(e); alerta("No se pudo hacer el registro. Toque el botón otra vez."); }
});

// --------------------------------------------------------------- justificación
const MIN = 20;
function revisarJus() {
  const n = $("jus").value.trim().length;
  const falta = Math.max(0, MIN - n);
  $("jusN").textContent = n;
  $("jusFalta").textContent = falta ? `Faltan ${falta} caracteres` : "Justificación completa";
  $("jusCont").classList.toggle("ok", !falta);
  $("jusCont").querySelector("i").style.width = Math.min(100, 100 * n / MIN) + "%";
  revisarBoton();
}
$("jus").addEventListener("input", revisarJus);

function listo() {
  const R = RONDAS[estado.ronda];
  if (!R) return false;
  if (R.justificar && $("jus").value.trim().length < MIN) return false;
  if (R.tipo === "estimar" || R.tipo === "calcular") return Number.isFinite(leerNumero()) && leerNumero() > 0;
  if (R.tipo === "ordenar") return orden.length === R.items.length;
  return !!seleccion;
}
function revisarBoton() { $("enviar").classList.toggle("apagado", !listo()); }

function leerNumero() {
  const el = $("valor"); if (!el) return NaN;
  const R = RONDAS[estado.ronda];
  let t = el.value.replace(/\s/g, "");
  if (R && R.dec === 0 && /^\d{1,3}([.,]\d{3})+$/.test(t)) t = t.replace(/[.,]/g, "");
  t = t.replace(/,/g, ".");
  return t === "" ? NaN : Number(t);
}
function mostrarLectura() {
  const R = RONDAS[estado.ronda], x = leerNumero(), el = $("lectura");
  if (!el) return;
  el.textContent = Number.isFinite(x) && x > 0 ? `Se registra como ${fmt(x, R.dec)} ${R.unidad}` : "";
}

$("enviar").addEventListener("click", async () => {
  if (!listo()) {
    const R = RONDAS[estado.ronda];
    if (R.justificar && $("jus").value.trim().length < MIN) alerta(`La justificación necesita al menos ${MIN} caracteres.`);
    else alerta("Complete la respuesta antes de enviar.");
    return;
  }
  const R = RONDAS[estado.ronda];
  let v;
  if (R.tipo === "estimar" || R.tipo === "calcular") v = leerNumero();
  else if (R.tipo === "ordenar") v = orden.join(",");
  else v = seleccion;
  try {
    await responder(yo.gid, estado.ronda, v, R.justificar ? $("jus").value.trim() : "");
    alerta("");
  } catch (e) { console.error(e); alerta("No se pudo enviar. Revise la conexión y toque otra vez."); }
});

// --------------------------------------------------------------- campos por tipo
function campoRonda(R, previa) {
  const c = $("rCampo"); c.innerHTML = "";
  seleccion = null; orden = [];
  if (R.tipo === "estimar" || R.tipo === "calcular") {
    c.innerHTML = `<div class="campo"><label for="valor">Su respuesta</label>
      <div class="entrada"><input id="valor" inputmode="decimal" autocomplete="off" placeholder="0"><span class="u">${R.unidad}</span></div>
      <div class="lectura" id="lectura"></div></div>`;
    if (previa) $("valor").value = previa.v;
    $("valor").addEventListener("input", () => { revisarBoton(); mostrarLectura(); });
    mostrarLectura();
  } else if (R.tipo === "ordenar") {
    const caja = document.createElement("div"); caja.className = "opcs"; c.appendChild(caja);
    const otra = document.createElement("button"); otra.className = "enlace"; otra.type = "button"; otra.textContent = "Empezar el orden de nuevo";
    c.appendChild(otra);
    if (previa) orden = String(previa.v).split(",");
    const dibujar = () => {
      caja.innerHTML = "";
      R.items.forEach(it => {
        const b = document.createElement("button"); b.type = "button"; b.className = "opc orden"; b.dataset.id = it.id;
        const pos = orden.indexOf(it.id);
        b.setAttribute("aria-pressed", pos >= 0 ? "true" : "false");
        b.innerHTML = `<span class="l">${pos >= 0 ? pos + 1 : ""}</span><span>${it.nombre}<span class="d">${it.det}</span></span>`;
        b.addEventListener("click", () => { if (pos < 0) { orden.push(it.id); dibujar(); revisarBoton(); } });
        caja.appendChild(b);
      });
    };
    otra.addEventListener("click", () => { orden = []; dibujar(); revisarBoton(); });
    dibujar();
  } else if (R.tipo === "opcion") {
    const caja = document.createElement("div"); caja.className = "opcs"; c.appendChild(caja);
    R.opciones.forEach((o, i) => {
      const b = document.createElement("button"); b.type = "button"; b.className = "opc"; b.dataset.id = o.id;
      b.innerHTML = `<span class="l">${"ABCD"[i]}</span><span>${o.txt}</span>`;
      b.addEventListener("click", () => { seleccion = o.id; caja.querySelectorAll(".opc").forEach(x => x.setAttribute("aria-pressed", x.dataset.id === o.id)); revisarBoton(); });
      caja.appendChild(b);
    });
    if (previa) { seleccion = previa.v; caja.querySelectorAll(".opc").forEach(x => x.setAttribute("aria-pressed", x.dataset.id === previa.v)); }
  } else if (R.tipo === "junta") {
    const t = document.createElement("table"); t.className = "escen";
    t.innerHTML = `<thead><tr><th>VPN, M USD</th>${R.escenarios.map(e => `<th>${fmt(e.pf, 2)} USD/kg<br>${Math.round(e.prob * 100)} %</th>`).join("")}</tr></thead>
      <tbody>${R.proyectos.map(p => `<tr><td>${p.id}</td>${R.escenarios.map(e => { const x = R.vpn[e.id][p.id]; return `<td class="num ${x < 0 ? "neg" : ""}">${fmt(x, 2)}</td>`; }).join("")}</tr>`).join("")}</tbody>`;
    const nota = document.createElement("p"); nota.className = "expl";
    nota.textContent = "VPN en M USD según el precio de la flema y su probabilidad.";
    const caja = document.createElement("div"); caja.className = "opcs";
    R.proyectos.forEach(p => {
      const b = document.createElement("button"); b.type = "button"; b.className = "opc proy"; b.dataset.id = p.id;
      b.innerHTML = `<span class="l">${p.id}</span><span>${p.nombre}</span>
        <span class="k"><span>CAPEX <b>${fmt(p.capex, 2)}</b> M USD</span><span>PBP <b>${fmt(p.pbp, 2)}</b> años</span></span>`;
      b.addEventListener("click", () => { seleccion = p.id; caja.querySelectorAll(".opc").forEach(x => x.setAttribute("aria-pressed", x.dataset.id === p.id)); revisarBoton(); });
      caja.appendChild(b);
    });
    c.append(caja, t, nota);
    if (previa) { seleccion = previa.v; caja.querySelectorAll(".opc").forEach(x => x.setAttribute("aria-pressed", x.dataset.id === previa.v)); }
  }
  pintarIconos(c);
}

function textoValor(R, v) {
  if (v === undefined || v === null || v === "") return "sin respuesta";
  if (R.tipo === "estimar" || R.tipo === "calcular") return `${fmt(Number(v), R.dec)} ${R.unidad}`;
  if (R.tipo === "ordenar") return String(v).split(",").join(", ");
  if (R.tipo === "opcion") { const o = R.opciones.find(x => x.id === v); return o ? o.txt : v; }
  if (R.tipo === "junta") { const p = R.proyectos.find(x => x.id === v); return p ? `${p.id} · ${p.nombre}` : v; }
  return String(v);
}
function textoCorrecta(R, mercado) {
  if (R.tipo === "estimar" || R.tipo === "calcular") return `${fmt(R.correcta, R.dec)} ${R.unidad}`;
  if (R.tipo === "ordenar") return R.correcta.join(", ");
  if (R.tipo === "opcion") return R.opciones.find(x => x.id === R.correcta).txt;
  if (R.tipo === "junta") { const e = R.escenarios.find(x => x.id === mercado); return e ? `Mercado de ${fmt(e.pf, 2)} USD/kg de etanol` : "Pendiente del sorteo"; }
  return "";
}

// --------------------------------------------------------------- pintado
function vista(id) { ["vUnirse", "vEspera", "vRonda", "vRevelada", "vFinal"].forEach(v => { $(v).hidden = v !== id; }); }

function pintarAvance() {
  const a = $("avance"); a.innerHTML = "";
  for (let n = 1; n <= N_RONDAS; n++) {
    const p = document.createElement("span"); p.className = "p";
    if (estado.ronda > n || (estado.ronda === n && estado.fase === "revelada") || estado.ronda >= 8) p.classList.add("hecha");
    else if (estado.ronda === n) p.classList.add("actual");
    a.appendChild(p);
  }
}

function miPuesto() {
  const t = tabla(estado, rondaContable(estado));
  const i = t.findIndex(f => f.id === yo.gid);
  return { total: i >= 0 ? t[i].total : 0, puesto: i >= 0 ? t[i].puesto : t.length, n: t.length };
}

function pintar() {
  if (!estado) return;
  pintarAvance();
  if (yo && yo.rev !== estado.rev) { yo = null; localStorage.removeItem(LLAVE); }
  if (yo && !(estado.g && estado.g[yo.gid])) { yo = null; localStorage.removeItem(LLAVE); }
  $("miGrupo").innerHTML = yo ? `<b></b>` : "";
  if (yo) $("miGrupo").querySelector("b").textContent = yo.nombre;
  if (!yo) { vista("vUnirse"); rondaPintada = -1; return; }

  const r = estado.ronda;
  const gr = estado.g[yo.gid];
  if (r === 0) {
    vista("vEspera");
    $("esperaTit").textContent = "Registro completo";
    $("esperaTxt").textContent = "Deje la página abierta.";
    return;
  }
  if (r >= 8) {
    const m = miPuesto();
    vista("vFinal");
    $("fTit").textContent = `Puesto ${m.puesto} de ${m.n}`;
    $("fTxt").textContent = `Terminó con ${fmt(m.total)} puntos. Mire el tablero del salón.`;
    return;
  }
  const R = RONDAS[r];
  const previa = gr.r && gr.r[r];
  if (estado.fase === "abierta" && estado.reab === r && previa) {
    rondaPintada = -1;
    vista("vEspera");
    $("esperaTit").textContent = "Respuesta registrada";
    $("esperaTxt").textContent = "La ronda sigue abierta para quienes faltan.";
    return;
  }
  if (estado.fase === "abierta") {
    if (rondaPintada !== r) {
      vista("vRonda");
      $("rEtq").textContent = `Ronda ${r} de ${N_RONDAS} · ${R.corto}`;
      $("rTit").textContent = R.titulo;
      $("rCtx").innerHTML = datosHTML(R, ICONOS) + (R.nota ? `<p class="nota">${R.nota}</p>` : "");
      $("rFor").hidden = !R.formula; $("rFor").textContent = R.formula || "";
      $("rPre").textContent = R.pregunta;
      $("rJus").hidden = !R.justificar;
      $("jus").value = previa && previa.j ? previa.j : "";
      campoRonda(R, previa);
      revisarJus();
      rondaPintada = r;
    }
    vista("vRonda");
    $("enviada").hidden = !previa;
    if (previa) $("enviada").textContent = pendiente ? "Guardada en el celular, sin señal todavía." : `Enviada, ${textoValor(R, previa.v)}.`;
    $("enviar").textContent = previa ? "Cambiar la respuesta" : "Enviar respuesta";
    revisarBoton();
    return;
  }
  // revelada
  rondaPintada = -1;
  vista("vRevelada");
  const pts = previa ? puntaje(r, previa.v, estado.mercado) : 0;
  const m = miPuesto();
  $("vEtq").textContent = `Ronda ${r} de ${N_RONDAS} · resultado`;
  $("vTit").textContent = R.titulo;
  $("vSuya").textContent = previa ? textoValor(R, previa.v) : "sin respuesta";
  $("vBuena").textContent = textoCorrecta(R, estado.mercado);
  $("vBuenaEt").textContent = R.tipo === "junta" ? "Mercado" : "Respuesta correcta";
  const pend = R.tipo === "junta" && !estado.mercado;
  $("vPts").textContent = pend ? "Pendiente" : fmt(pts || 0);
  $("vPts").className = pend ? "num" : "grande " + (pts >= 70 ? "ok" : pts === 0 ? "mal" : "");
  $("vTot").textContent = `${fmt(m.total)} puntos, puesto ${m.puesto} de ${m.n}`;
  $("vExp").innerHTML = pend ? "El tablero sortea el precio de la flema." : cadenaHTML(R) + `<p>${R.explicacion}</p>`;
}

pintarIconos();
escuchar((d, p) => { estado = d; pendiente = !!p; pintar(); }, () => alerta("Se perdió la conexión con la base de datos. Recarguen la página."));
</script>
</body>
</html>
