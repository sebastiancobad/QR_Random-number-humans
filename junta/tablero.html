<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tablero · Junta de inversión</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+Condensed:wght@600;700&family=IBM+Plex+Sans:wght@400;600&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="junta.css">
</head>
<body>
<div class="tab" id="tablero">
  <header class="tab-cabeza">
    <div>
      <div class="t">Junta de inversión</div>
      <div class="s">Diseño de Plantas Químicas</div>
    </div>
    <div class="rondas">
      <div class="avance" id="avance"></div>
      <div class="nombres" id="nombres"></div>
    </div>
    <div class="acciones">
      <button class="btn" id="principal" type="button">Abrir la ronda 1</button>
      <button class="btn sec" id="atras" type="button">Volver a abrir</button>
      <button class="btn sec" id="completa" type="button">Pantalla completa</button>
    </div>
  </header>

  <main class="tab-cuerpo" id="cuerpo"></main>

  <footer class="tab-pie">
    <span id="modo"></span>
    <button id="exportar" type="button">Exportar a Excel</button>
    <button id="simular" type="button" hidden>Simular respuestas de ejemplo</button>
    <button id="reiniciar" type="button">Reiniciar la junta</button>
  </footer>
</div>

<script type="module">
import { ICONOS } from "./iconos.js";
import { RONDAS, N_RONDAS, fmt, puntaje, tabla, rondaContable, sortearMercado, datosHTML, cadenaHTML } from "./rondas.js";
import QRCode from "../assets/qrcode.js";

const $ = id => document.getElementById(id);
const cuerpo = $("cuerpo");
let datos;
try { datos = await import("./datos.js"); }
catch (e) { console.error(e); cuerpo.innerHTML = `<div class="alerta">No se pudo conectar con la base de datos. Revise la conexión y recargue la página.</div>`; throw e; }
const { escuchar, fijar, registrar, responder, quitarGrupo, reiniciar, sesion, SESION_POR_DEFECTO, CLAVE_PANEL, modoDemo, nuevoId } = datos;

$("modo").textContent = modoDemo ? "Ensayo" : "";
$("simular").hidden = !modoDemo;

const base = location.href.replace(/[?#].*$/, "").replace(/tablero(\.html)?$/, "");
const params = [];
if (sesion !== SESION_POR_DEFECTO) params.push("s=" + encodeURIComponent(sesion));
if (modoDemo) params.push("demo");
const urlCel = base + (params.length ? "?" + params.join("&") : "");

let estado = null;
let sorteando = false;

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const grupos = () => Object.entries(estado.g || {}).filter(([, g]) => g && g.nombre);

function qr(canvas, ancho) {
  QRCode.toCanvas(canvas, urlCel, { width: ancho, margin: 1, errorCorrectionLevel: "M", color: { dark: "#0B3D6B", light: "#FFFFFF" } },
    err => { if (err) { console.error(err); canvas.replaceWith(Object.assign(document.createElement("p"), { textContent: "El código QR no se pudo dibujar. Los estudiantes pueden escribir la dirección que aparece debajo." })); } });
}

// --------------------------------------------------------------- cabecera
function pintarCabecera() {
  const a = $("avance"), nm = $("nombres"); a.innerHTML = ""; nm.innerHTML = "";
  for (let n = 1; n <= N_RONDAS; n++) {
    const p = document.createElement("span"); p.className = "p";
    if (estado.ronda > n || (estado.ronda === n && estado.fase === "revelada") || estado.ronda >= 8) p.classList.add("hecha");
    else if (estado.ronda === n) p.classList.add("actual");
    a.appendChild(p);
    const s = document.createElement("span"); s.textContent = RONDAS[n].corto; nm.appendChild(s);
  }
  const r = estado.ronda, f = estado.fase, R = RONDAS[r];
  let txt = "";
  if (r === 0) txt = "Abrir la ronda 1";
  else if (r >= 8) txt = "Junta terminada";
  else if (f === "abierta") txt = "Revelar la respuesta";
  else if (R.tipo === "junta" && !estado.mercado) txt = "Sortear el mercado";
  else txt = r === N_RONDAS ? "Ver el resultado final" : `Abrir la ronda ${r + 1}`;
  $("principal").textContent = txt;
  $("principal").disabled = r >= 8;
  $("atras").hidden = !(r >= 1 && r <= N_RONDAS && f === "revelada");
}

$("principal").addEventListener("click", async () => {
  const r = estado.ronda, f = estado.fase, R = RONDAS[r];
  if (r === 0) return fijar({ ronda: 1, fase: "abierta", reab: null });
  if (r >= 8) return;
  if (f === "abierta") return fijar({ fase: "revelada" });
  if (R.tipo === "junta" && !estado.mercado) return sortear();
  return fijar(r === N_RONDAS ? { ronda: 8, reab: null } : { ronda: r + 1, fase: "abierta", reab: null });
});
$("atras").addEventListener("click", () => fijar({ fase: "abierta", reab: estado.ronda, ...(RONDAS[estado.ronda].tipo === "junta" ? { mercado: null } : {}) }));
$("completa").addEventListener("click", () => { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); });

// --------------------------------------------------------------- sala de espera
function pintarSala() {
  cuerpo.innerHTML = `<div class="sala">
    <div class="qr-caja"><canvas id="qrG" width="560" height="560"></canvas><a class="url" id="url"></a></div>
    <div>
      <h2>Escaneen el código y escriban su nombre</h2>
      <p class="lead">El primer puesto gana la nota.</p>
      <div style="display:flex;gap:28px;align-items:end;margin-top:22px"><div><div class="cifra" id="nG">0</div><div class="cifra-et">estudiantes registrados</div></div></div>
      <div class="grupos" id="lista"></div>
    </div></div>`;
  $("url").textContent = urlCel.replace(/^https?:\/\//, ""); $("url").href = urlCel;
  qr($("qrG"), 560);
  pintarListaSala();
}
function pintarListaSala() {
  const l = $("lista"); if (!l) return;
  $("nG").textContent = grupos().length;
  l.innerHTML = grupos().map(([id, g]) => `<span class="grupo">${esc(g.nombre)}<button class="x" data-id="${id}" title="Quitar participante" type="button">×</button></span>`).join("");
  l.querySelectorAll(".x").forEach(b => b.addEventListener("click", () => { if (confirm("¿Quitar este participante de la junta?")) quitarGrupo(b.dataset.id); }));
}

// --------------------------------------------------------------- ronda abierta
function pintarAbierta(R) {
  let extra = "";
  if (R.tipo === "ordenar") extra = `<div class="mosaico">${R.items.map(i => `<div class="tile"><b>${esc(i.nombre)}</b><span>${esc(i.det)}</span></div>`).join("")}</div>`;
  if (R.tipo === "opcion") extra = `<div class="mosaico">${R.opciones.map((o, i) => `<div class="tile op"><span class="le">${"ABCD"[i]}</span><b>${esc(o.txt)}</b></div>`).join("")}</div>`;
  if (R.tipo === "junta") extra = tablaJunta(R, null);
  cuerpo.innerHTML = `<div class="ronda">
    <div>
      <div class="etq">Ronda ${R.n} de ${N_RONDAS}</div>
      <h2>${esc(R.titulo)}</h2>
      ${datosHTML(R, ICONOS)}
      ${R.nota ? `<p class="cifra-et">${esc(R.nota)}</p>` : ""}
      ${R.formula ? `<div class="formula">${esc(R.formula)}</div>` : ""}
      <p class="pregunta">${esc(R.pregunta)}</p>
      ${extra}
    </div>
    <div class="lado">
      <div class="tarjeta"><div class="cifra" id="nResp">0</div><div class="cifra-et" id="nTxt">respondieron</div></div>
      <div class="grupos" id="lista"></div>
      <div class="qr-caja"><canvas id="qrP" width="360" height="360"></canvas></div>
    </div></div>`;
  qr($("qrP"), 360);
  pintarListaRonda(R);
}
function pintarListaRonda(R) {
  const l = $("lista"); if (!l) return;
  const gs = grupos(); const resp = gs.filter(([, g]) => g.r && g.r[R.n]);
  $("nResp").textContent = resp.length; $("nTxt").textContent = `de ${gs.length} respondieron`;
  l.innerHTML = gs.map(([id, g]) => `<span class="grupo ${g.r && g.r[R.n] ? "listo" : ""}">${esc(g.nombre)}<button class="x" data-id="${id}" title="Quitar participante" type="button">×</button></span>`).join("");
  l.querySelectorAll(".x").forEach(b => b.addEventListener("click", () => { if (confirm("¿Quitar este participante de la junta?")) quitarGrupo(b.dataset.id); }));
}

function tablaJunta(R, mercado, votos) {
  return `<table class="escen" style="font-size:1.15rem">
    <thead><tr><th>Alternativa</th><th>CAPEX</th><th>PBP, años</th>${R.escenarios.map(e => `<th>VPN <span class="p">${fmt(e.pf, 2)} (${Math.round(e.prob * 100)} %)</span></th>`).join("")}${mercado === null ? "" : "<th>VPN esperado</th>"}${votos ? "<th>Votos</th>" : ""}</tr></thead>
    <tbody>${R.proyectos.map(p => `<tr><td><b>${p.id}</b> · ${esc(p.nombre)}</td><td class="num">${fmt(p.capex, 2)}</td><td class="num">${fmt(p.pbp, 2)}</td>
      ${R.escenarios.map(e => { const x = R.vpn[e.id][p.id]; return `<td class="num ${x < 0 ? "neg" : ""}" style="${mercado === e.id ? "background:#DCE6F0;font-weight:700" : ""}">${fmt(x, 2)}</td>`; }).join("")}
      ${mercado === null ? "" : `<td class="num">${fmt(R.ev[p.id], 2)}</td>`}${votos ? `<td class="num votos">${votos[p.id] || 0}</td>` : ""}</tr>`).join("")}</tbody></table>
    <p class="cifra-et">CAPEX y VPN en M USD. Precio de la acetona recuperada en USD/kg con su probabilidad.</p>`;
}

// --------------------------------------------------------------- gráficos de la revelación
function svgPuntos(R, vals) {
  const W = 900, H = 170, m = 40;
  const log = R.tipo === "estimar";
  const xs = vals.map(v => v.v).filter(x => x > 0);
  let lo, hi;
  if (log) { lo = Math.min(R.correcta / 10, ...xs); hi = Math.max(R.correcta * 10, ...xs); }
  else { lo = Math.min(R.correcta * 0.5, ...xs); hi = Math.max(R.correcta * 1.5, ...xs); }
  const f = x => log ? Math.log10(x) : x;
  const X = x => m + (W - 2 * m) * (f(x) - f(lo)) / (f(hi) - f(lo) || 1);
  let ticks = [];
  if (log) { for (let e = Math.floor(Math.log10(lo)); e <= Math.ceil(Math.log10(hi)); e++) ticks.push(10 ** e); }
  else { const paso = (hi - lo) / 5; for (let k = 0; k <= 5; k++) ticks.push(lo + k * paso); }
  ticks = ticks.filter(t => t >= lo * 0.999 && t <= hi * 1.001);
  const bins = {}; vals.forEach(v => { const k = Math.round(X(v.v) / 26); (bins[k] = bins[k] || []).push(v); });
  const pts = Object.values(bins).map(g => ({ cx: g.reduce((a, v) => a + X(v.v), 0) / g.length, n: g.length, nombres: g.map(v => v.nombre).join(", ") }));
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Respuestas frente al valor correcto">
    <line x1="${m}" x2="${W - m}" y1="120" y2="120" stroke="#5D6878" stroke-width="1.5"/>
    ${ticks.map(t => `<line x1="${X(t)}" x2="${X(t)}" y1="120" y2="126" stroke="#5D6878"/><text x="${X(t)}" y="145" font-size="15" text-anchor="middle" fill="#5D6878" font-family="IBM Plex Mono, Consolas, monospace">${fmt(t, R.dec && !log ? R.dec : 0)}</text>`).join("")}
    <line x1="${X(R.correcta)}" x2="${X(R.correcta)}" y1="14" y2="120" stroke="#13795B" stroke-width="3"/>
    <text x="${X(R.correcta) + 8}" y="26" font-size="16" fill="#13795B" font-weight="600" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">valor correcto</text>
    ${pts.map(p => `<circle cx="${p.cx}" cy="96" r="${p.n > 1 ? 15 : 10}" fill="#0B3D6B" fill-opacity=".88"><title>${esc(p.nombres)}</title></circle>${p.n > 1 ? `<text x="${p.cx}" y="101" font-size="14" text-anchor="middle" fill="#fff" font-weight="600" font-family="IBM Plex Mono, Consolas, monospace">${p.n}</text>` : ""}`).join("")}
    <text x="${W - m}" y="166" font-size="14" text-anchor="end" fill="#5D6878" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">${R.unidad}${log ? ", escala logarítmica" : ""}</text></svg>`;
}
function svgBarras(etiquetas, cuentas, correcta) {
  const W = 900, fila = 46, H = etiquetas.length * fila + 10, x0 = 330;
  const max = Math.max(1, ...cuentas);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Respuestas por opción">
    ${etiquetas.map((e, i) => { const w = (W - x0 - 60) * cuentas[i] / max; const ok = i === correcta;
      return `<text x="${x0 - 12}" y="${i * fila + 30}" font-size="17" text-anchor="end" fill="#13233A" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-weight="${ok ? 700 : 400}">${esc(e)}</text>
      <rect x="${x0}" y="${i * fila + 10}" width="${Math.max(w, 2)}" height="30" rx="4" fill="${ok ? "#13795B" : "#9AA6B4"}"/>
      <text x="${x0 + Math.max(w, 2) + 10}" y="${i * fila + 31}" font-size="17" fill="#13233A" font-family="IBM Plex Mono, Consolas, monospace">${cuentas[i]}</text>`; }).join("")}</svg>`;
}

function svgValores(etiquetas, vals, unidad, dec, ok, votos) {
  const W = 900, fila = 56, H = etiquetas.length * fila + 10, x0 = 300;
  const max = Math.max(...vals.map(Math.abs), 1e-9);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Valores de cada opción">
    ${etiquetas.map((e, i) => { const w = (W - x0 - 330) * Math.abs(vals[i]) / max; const bien = i === ok;
      return `<text x="${x0 - 14}" y="${i * fila + 36}" font-size="20" text-anchor="end" fill="#13233A" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif" font-weight="${bien ? 700 : 400}">${esc(e)}</text>
      <rect x="${x0}" y="${i * fila + 12}" width="${Math.max(w, 3)}" height="36" rx="5" fill="${bien ? "#13795B" : "#9AA6B4"}"/>
      <text x="${x0 + Math.max(w, 3) + 12}" y="${i * fila + 37}" font-size="19" fill="#13233A" font-family="IBM Plex Mono, Consolas, monospace" font-weight="600">${fmt(vals[i], dec)} ${unidad}</text>
      ${votos ? `<text x="${W - 6}" y="${i * fila + 37}" font-size="16" text-anchor="end" fill="#5D6878" font-family="IBM Plex Sans, Segoe UI, Arial, sans-serif">${votos[i]} ${votos[i] === 1 ? "voto" : "votos"}</text>` : ""}`; }).join("")}</svg>`;
}

function posiciones(hasta, marcarRonda) {
  const t = tabla(estado, hasta);
  if (!t.length) return "<p class='cifra-et'>Todavía no hay participantes.</p>";
  return `<table class="posiciones"><thead><tr><th>#</th><th>Participante</th>${marcarRonda ? "<th>Ronda</th>" : ""}<th>Total</th></tr></thead><tbody>
    ${t.slice(0, 10).map(f => `<tr class="${f.puesto === 1 ? "top1" : ""}"><td class="num">${f.puesto}</td><td>${esc(f.nombre)}</td>${marcarRonda ? `<td class="num">${f.pts[marcarRonda] === null ? "" : fmt(f.pts[marcarRonda])}</td>` : ""}<td class="num">${fmt(f.total)}</td></tr>`).join("")}</tbody></table>`;
}

function pintarRevelada(R) {
  const gs = grupos();
  const resp = gs.map(([id, g]) => ({ id, nombre: g.nombre, ...(g.r && g.r[R.n] ? g.r[R.n] : {}) })).filter(x => x.v !== undefined);
  let respuesta = "", fig = "";
  if (R.tipo === "estimar" || R.tipo === "calcular") {
    respuesta = `<div class="respuesta"><span class="v">${fmt(R.correcta, R.dec)}</span><span class="u">${R.unidad}</span></div>`;
    fig = (resp.length ? svgPuntos(R, resp.map(x => ({ v: Number(x.v), nombre: x.nombre }))) : "") + cadenaHTML(R);
  } else if (R.tipo === "ordenar") {
    const exactos = resp.filter(x => x.v === R.correcta.join(",")).length;
    respuesta = `<p class="cifra-et">${exactos} de ${resp.length} acertaron el orden completo</p>`;
    fig = svgValores(R.correcta.map((id, k) => `${k + 1}. ${R.items.find(x => x.id === id).nombre}`), R.correcta.map(id => R.cbm[id]), "M USD", 3, 0, null);
  } else if (R.tipo === "opcion") {
    const i = R.opciones.findIndex(o => o.id === R.correcta);
    respuesta = `<div class="respuesta"><span class="v" style="font-size:2.6rem;font-family:var(--display)">${"ABCD"[i]}. ${esc(R.opciones[i].txt)}</span></div>`;
    fig = svgValores(R.opciones.map((o, k) => `${"ABCD"[k]}. ${o.txt}`), R.opciones.map(o => R.valores[o.id]), R.unidadValores, R.decValores, i, R.opciones.map(o => resp.filter(x => x.v === o.id).length));
  } else if (R.tipo === "junta") {
    const e = R.escenarios.find(x => x.id === estado.mercado);
    respuesta = `<div class="mercado" id="mercado">${R.escenarios.map(x => `<div class="mcarta ${estado.mercado ? (x.id === estado.mercado ? "sale" : "apaga") : ""}" data-id="${x.id}"><div class="pf">${fmt(x.pf, 2)}</div><div>USD/kg de acetona</div><div class="pr">probabilidad ${Math.round(x.prob * 100)} %</div></div>`).join("")}</div>
      ${e ? `<p class="expl-tab"><b>${esc(e.txt)}.</b></p>` : ""}`;
    const votos = {}; resp.forEach(x => { votos[x.v] = (votos[x.v] || 0) + 1; });
    fig = tablaJunta(R, estado.mercado || "", votos);
  }
  const pend = R.tipo === "junta" && !estado.mercado;
  cuerpo.innerHTML = `<div class="ronda">
    <div>
      <div class="etq">Ronda ${R.n} de ${N_RONDAS} · respuesta</div>
      <h2>${esc(R.titulo)}</h2>
      ${respuesta}
      <div class="fig">${fig}</div>
      ${pend ? "" : `<p class="expl-tab">${esc(R.explicacion)}</p>`}
    </div>
    <div class="lado"><div class="tarjeta"><h3>Clasificación</h3>${posiciones(pend ? R.n - 1 : R.n, pend ? 0 : R.n)}</div></div></div>`;
}

async function sortear() {
  if (sorteando) return; sorteando = true;
  const cartas = [...document.querySelectorAll(".mcarta")];
  const fin = sortearMercado();
  const ids = ["bajo", "base", "alto"];
  let k = 0; const vueltas = 14 + ids.indexOf(fin);
  await new Promise(res => {
    const paso = () => {
      cartas.forEach(c => c.classList.toggle("giro", c.dataset.id === ids[k % 3]));
      k++;
      if (k <= vueltas) setTimeout(paso, 90 + k * 12); else res();
    };
    paso();
  });
  sorteando = false;
  await fijar({ mercado: fin });
  pintar();
}

// --------------------------------------------------------------- final
function ganadores(t) {
  if (!t.length) return "";
  const g = t.filter(f => f.total === t[0].total).map(f => esc(f.nombre));
  return g.length === 1 ? `${g[0]} gana la nota del concurso con ${fmt(t[0].total)} puntos.`
    : `${g.slice(0, -1).join(", ")} y ${g[g.length - 1]} empatan en el primer puesto con ${fmt(t[0].total)} puntos.`;
}
function pintarFinal() {
  const t = tabla(estado, N_RONDAS);
  const podio = [t[1], t[0], t[2]];
  cuerpo.innerHTML = `<h2 style="font-family:var(--display);font-size:3rem;margin:0">Resultado de la junta</h2>
    <p class="lead">${ganadores(t)}</p>
    <div class="podio">${podio.map((f, i) => f ? `<div class="esc e${Math.min(f.puesto, 3)}"><div class="pos">${f.puesto}</div><div class="nom">${esc(f.nombre)}</div><div class="pts">${fmt(f.total)} puntos</div></div>` : "<div></div>").join("")}</div>
    <div class="tarjeta"><table class="posiciones"><thead><tr><th>#</th><th>Participante</th>${[1, 2, 3, 4, 5, 6, 7].map(n => `<th>${RONDAS[n].corto}</th>`).join("")}<th>Total</th></tr></thead><tbody>
    ${t.map(f => `<tr class="${f.puesto === 1 ? "top1" : ""}"><td class="num">${f.puesto}</td><td>${esc(f.nombre)}</td>${[1, 2, 3, 4, 5, 6, 7].map(n => `<td class="num">${f.pts[n] === null ? "" : fmt(f.pts[n])}</td>`).join("")}<td class="num">${fmt(f.total)}</td></tr>`).join("")}</tbody></table></div>`;
}

// --------------------------------------------------------------- pintado general
let firma = "";
function pintar() {
  if (!estado) return;
  pintarCabecera();
  const r = estado.ronda, R = RONDAS[r];
  const f = `${r}|${estado.fase}|${estado.mercado}|${estado.rev}`;
  if (f !== firma || estado.fase === "revelada" || r >= 8) {
    if (r === 0) { if (f !== firma) pintarSala(); else pintarListaSala(); }
    else if (r >= 8) pintarFinal();
    else if (estado.fase === "abierta") { if (f !== firma) pintarAbierta(R); else pintarListaRonda(R); }
    else if (!sorteando) pintarRevelada(R);
  } else if (r === 0) pintarListaSala();
  else pintarListaRonda(R);
  firma = f;
}

// --------------------------------------------------------------- pie
$("reiniciar").addEventListener("click", async () => {
  if (prompt("Escriba la clave del tablero") !== CLAVE_PANEL) return;
  await reiniciar(estado ? estado.rev || 0 : 0);
});

$("simular").addEventListener("click", async () => {
  const nombres = ["Laura Gómez", "Andrés Rojas", "Camila Díaz", "Santiago Pérez", "Valentina Ruiz", "Mateo Herrera"];
  const ejemplo = { 1: [92480, 94000, 3800000, 92500, 11.6, 90000], 2: [10255, 10300, 9000, 10250, 20600, 4300],
    3: [11821, 11800, 6850, 11820, 11500, 9000], 4: [0.834, 0.83, 1.1, 0.7, 0.834, 0.66], 5: ["material", "volumen", "material", "presion", "material", "platos"],
    6: ["vapor", "mosto", "vapor", "mosto", "fijos", "mosto"], 7: ["C", "D", "A", "C", "B", "D"] };
  let gs = grupos();
  if (gs.length < 3) { for (const n of nombres) await registrar("g" + nuevoId(), n); gs = grupos(); }
  const r = estado.ronda;
  if (r >= 1 && r <= N_RONDAS) {
    let k = 0;
    for (const [id, g] of grupos()) { const v = ejemplo[r][k % 6]; k++; if (g.r && g.r[r]) continue; await responder(id, r, v, RONDAS[r].justificar ? "Respuesta de ejemplo para ensayar el tablero sin red." : ""); }
  }
});

$("exportar").addEventListener("click", async () => {
  if (!estado) return;
  if (!window.XLSX) {
    await new Promise((res, rej) => { const s = document.createElement("script"); s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"; s.onload = res; s.onerror = rej; document.head.appendChild(s); })
      .catch(() => alert("No se pudo cargar la librería de Excel. Revise la conexión."));
    if (!window.XLSX) return;
  }
  const t = tabla(estado, rondaContable(estado));
  const resumen = [["Puesto", "Participante", ...[1, 2, 3, 4, 5, 6, 7].map(n => `Ronda ${n} · ${RONDAS[n].corto}`), "Total"],
    ...t.map(f => [f.puesto, f.nombre, ...[1, 2, 3, 4, 5, 6, 7].map(n => f.pts[n] ?? ""), f.total])];
  const legible = (n, v) => { const R = RONDAS[n];
    if (R.tipo === "opcion") { const o = R.opciones.find(z => z.id === v); return o ? o.txt : v; }
    if (R.tipo === "junta") { const p = R.proyectos.find(z => z.id === v); return p ? `${p.id} · ${p.nombre}` : v; }
    if (R.tipo === "ordenar") return String(v).split(",").join(", ");
    return Number(v); };
  const resp = [["Id", "Participante", "Ronda", "Respuesta", "Puntos", "Hora"]];
  const just = [["Id", "Participante", "Ronda", "Justificación"]];
  for (const [id, g] of grupos()) for (let n = 1; n <= N_RONDAS; n++) {
    const x = g.r && g.r[n]; if (!x) continue;
    resp.push([id, g.nombre, n, legible(n, x.v), puntaje(n, x.v, estado.mercado) ?? "", new Date(x.t)]);
    if (x.j) just.push([id, g.nombre, n, x.j]);
  }
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(resumen), "Resumen");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(resp, { cellDates: true }), "Respuestas");
  XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(just), "Justificaciones");
  XLSX.writeFile(wb, `junta-${sesion}.xlsx`);
});

escuchar(d => { estado = d; pintar(); }, () => { cuerpo.insertAdjacentHTML("afterbegin", `<div class="alerta">Se perdió la conexión con la base de datos.</div>`); });
</script>
